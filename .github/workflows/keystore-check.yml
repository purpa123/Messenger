name: Check keystore digest
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and hash keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYCODE'
          import os,base64,hashlib
          value=''.join(os.environ['KEYSTORE_BASE64'].split())
          try:
              data=base64.b64decode(value,validate=True)
          except Exception:
              raise SystemExit('KEYSTORE_BASE64 is not valid Base64')
          print('Decoded keystore bytes: '+str(len(data)))
          print('Decoded keystore SHA-256: '+hashlib.sha256(data).hexdigest())
          PYCODE
