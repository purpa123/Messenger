name: Build signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: "470DC37B411811DE320C3A54FEC1FCCA27EFB8C938C653D1FF4522C5F55B90E7"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Create Android platform files if missing
        run: |
          if [ ! -d android ]; then flutter create --project-name=purpa_messenger --org=com.purpa --platforms=android .; fi

      - name: Configure Android app
        run: |
          rm -f README.md test/widget_test.dart
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          text = text.replace('android:label="purpa_messenger"', 'android:label="Messenger"')
          path.write_text(text)
          PYCODE

      - name: Restore permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/messenger-release.jks

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is missing"; exit 1; }
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=messenger-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if 'messenger-release.jks' not in s:
              marker = 'android {'
              insert = '''android {\n    signingConfigs {\n        create("releaseMessenger") {\n            storeFile = file("messenger-release.jks")\n            storePassword = System.getenv("KEYSTORE_PASSWORD")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEY_PASSWORD")\n        }\n    }'''
              s = s.replace(marker, insert, 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("releaseMessenger")')
              p.write_text(s)
          PY

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Verify permanent signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee cert.txt
          ACTUAL=$(grep 'Signer #1 certificate SHA-256 digest:' cert.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "Expected: $EXPECTED_CERT_SHA256"
          echo "Actual:   $ACTUAL"
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256" || { echo "ERROR: APK was signed with the wrong certificate"; exit 1; }

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Messenger-v0.3.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Messenger-v0.3.0
          path: Messenger-v0.3.0.apk
